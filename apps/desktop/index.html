<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Upshot</title>
    <script src="/theme-boot.js"></script>
    <link
      rel="preload"
      href="/fonts/Geist-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      html, body, #root {
        background: transparent !important;
        background-color: transparent !important;
      }
      html[data-rounded-window] #boot-splash,
      html[data-rounded-window] #root {
        clip-path: inset(0 round 10px);
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: hsl(0 0% 0%);
      }
      html:not(.dark) #boot-splash {
        background: hsl(60 9% 98%);
      }
      .boot-splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      body:has(#root:not(:empty)) #boot-splash {
        display: none;
      }
      .boot-splash-mark {
        position: relative;
        width: 4.5rem;
        /* Fork: flat, no drop shadow (design-system.md "Flat"; journey-first-run P3). */
      }
      .boot-splash-mark svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .boot-splash-base {
        color: hsl(24 10% 10% / 0.2);
      }
      html.dark .boot-splash-base {
        color: hsl(0 0% 96% / 0.2);
      }
      .boot-splash-highlight {
        position: absolute;
        inset: 0;
        color: hsl(24 10% 10% / 0.75);
        -webkit-mask-image: linear-gradient(
          105deg,
          transparent 36%,
          #000 50%,
          transparent 64%
        );
        mask-image: linear-gradient(
          105deg,
          transparent 36%,
          #000 50%,
          transparent 64%
        );
        -webkit-mask-size: 220% 100%;
        mask-size: 220% 100%;
        animation: boot-splash-shimmer 2.4s ease-in-out infinite;
      }
      html.dark .boot-splash-highlight {
        color: hsl(20 100% 56% / 0.9);
      }
      .boot-splash-detail {
        max-width: 16rem;
        margin: 1.25rem 0 0;
        color: hsl(25 5% 45%);
        font-family:
          "Geist", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 0.694rem;
        line-height: 1rem;
        text-align: center;
        opacity: 0;
        animation: boot-splash-detail-reveal 0s linear 2s forwards;
      }
      html.dark .boot-splash-detail {
        color: hsl(0 0% 60%);
      }
      @keyframes boot-splash-shimmer {
        0% {
          -webkit-mask-position: 120% 0%;
          mask-position: 120% 0%;
        }
        100% {
          -webkit-mask-position: -20% 0%;
          mask-position: -20% 0%;
        }
      }
      @keyframes boot-splash-detail-reveal {
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash-highlight {
          animation: none;
          opacity: 0;
        }
      }
    </style>
    <script src="/relay-shim.js"></script>
  </head>
  <body spellcheck="false">
    <div id="boot-splash" data-tauri-drag-region aria-hidden="true">
      <div class="boot-splash-content">
        <div class="boot-splash-mark">
          <svg
            class="boot-splash-base"
            viewBox="233 208 557 610"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              d="M237 357A62 62 0 0 1 299 295L323 295A62 62 0 0 1 385 357L385 582A94 94 0 0 0 573 582L573 385Q573 355 598 335L750 219Q768 207 780 218Q785 223 785 235L785 322Q785 337 773 346L730 378Q717 388 717 405L717 572A240 240 0 0 1 237 572Z"
            />
          </svg>
          <div class="boot-splash-highlight" aria-hidden="true">
            <svg viewBox="233 208 557 610" fill="currentColor">
              <path
                d="M237 357A62 62 0 0 1 299 295L323 295A62 62 0 0 1 385 357L385 582A94 94 0 0 0 573 582L573 385Q573 355 598 335L750 219Q768 207 780 218Q785 223 785 235L785 322Q785 337 773 346L730 378Q717 388 717 405L717 572A240 240 0 0 1 237 572Z"
              />
            </svg>
          </div>
        </div>
        <p class="boot-splash-detail">
          Loading Upshot. This is taking longer than expected.
        </p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
